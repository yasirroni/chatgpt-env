name: Build semantic search environment
run-name: Build semantic-search for Python 3.13 by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-semantic-search
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT_NAME: semantic-search

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Build and validate bundle
        run: scripts/build_environment.sh "$ENVIRONMENT_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_release.sh "$ENVIRONMENT_NAME"
