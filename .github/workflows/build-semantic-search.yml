name: Build semantic search environment
run-name: Build semantic-search for Python 3.13 by @${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-semantic-search
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENVIRONMENT_NAME: semantic-search

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.10.0"
          python-version: "3.13"
          working-directory: environments/semantic-search

      - name: Build and validate bundle
        run: scripts/build_environment.sh "$ENVIRONMENT_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish_release.sh "$ENVIRONMENT_NAME"
