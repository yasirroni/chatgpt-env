[project]
name = "semantic-search"
version = "0.1.0"
description = "Offline semantic-search additions for Linux x86-64 ChatGPT sandboxes"
requires-python = "==3.13.*"
dependencies = [
  "safetensors==0.8.0",
  "sentence-transformers==5.6.0",
  "sqlite-vec==0.1.9",
  "tokenizers==0.22.2",
  "transformers==5.14.1",
]

[tool.uv]
package = false
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
]
# These dependencies are supplied by the target ChatGPT Python runtime.
exclude-dependencies = [
  "huggingface-hub",
  "numpy",
  "packaging",
  "pyyaml",
  "regex",
  "scikit-learn",
  "scipy",
  "torch",
  "tqdm",
  "typer",
  "typing-extensions",
]
